[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "effitech-esp-data"
version = "0.1.0"
description = "Пульс скважины: сбор и загрузка данных"
requires-python = ">=3.11"
dependencies = ["opentelemetry-api==1.38.0", "opentelemetry-sdk==1.38.0", "effitech-esp-model==0.1.0", "requests>=2.31", "python-dotenv>=1", "pandas>=2.0,<2.4", "numpy>=1.24", "openpyxl>=3.1", "clickhouse-connect>=0.7", "psycopg2-binary>=2.9", "yadisk>=3", "sqlalchemy>=2"]

[project.optional-dependencies]
test = ["pytest>=7"]
presentation = ["effitech-pulse-contracts==0.1.1", "grpcio>=1.78,<2"]

[tool.setuptools.packages.find]
include = ["utils*", "scripts*"]
namespaces = true

[tool.setuptools.package-data]
"utils.parsers" = ["batch_config*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
