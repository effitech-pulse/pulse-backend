[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "effitech-esp-model"
version = "0.1.0"
description = "Пульс скважины: признаки, обучение и прогноз УЭЦН"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0,<2.4", "numpy>=1.24", "pyyaml>=6", "openpyxl>=3.1", "python-dotenv>=1", "clickhouse-connect>=0.7", "psycopg2-binary>=2.9", "catboost>=1.2", "scikit-learn>=1.3", "lifelines>=0.30"]

[project.optional-dependencies]
test = ["pytest>=7"]
deep-learning = ["torch>=2"]

[tool.setuptools.packages.find]
include = ["esp*", "scripts*"]
namespaces = true

[tool.setuptools.package-data]
esp = ["config/*.yaml", "params/*.json"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
