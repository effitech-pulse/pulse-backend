syntax = "proto3";
package pulse.ml.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/effitech-pulse/pulse-contracts/gen/go/pulse/ml/v1;mlv1";

// Числа полей не менять и не переиспользовать при развитии контракта.
service MLService {
  rpc Health(google.protobuf.Empty) returns (HealthResponse);
  rpc GetSnapshot(SnapshotRequest) returns (SnapshotResponse);
  rpc Score(google.protobuf.Empty) returns (SnapshotResponse);
  rpc Explain(ExplainRequest) returns (ExplainResponse);
  rpc History(HistoryRequest) returns (HistoryResponse);
  rpc Metrics(google.protobuf.Empty) returns (MetricsResponse);
  rpc Upload(stream UploadChunk) returns (UploadResponse);
  // Строгий pin до вычисления; UNIMPLEMENTED старого peer запрещает fallback на Upload.
  rpc UploadPinned(stream PinnedUploadChunk) returns (UploadResponse);
  rpc ModelHealth(ModelHealthRequest) returns (ModelHealthResponse);
}
message HealthResponse {
  string status = 1;
}
message SnapshotRequest {
  optional double min_risk = 1;
}
message WellRisk {
  int64 well_id = 1;
  optional int64 unitek_id = 2;
  optional string oilfield = 3;
  double risk = 4;
  bool alert = 5;
  optional string tier = 6;
  int64 windows_fired = 7;
  int64 windows_total = 8;
  bool data_ok = 9;
  repeated string rule_findings = 10;
  optional string window_end = 11; // ISO 8601, как в публичном HTTP API.
  optional int32 true_failure_type = 12;
  optional string true_failure_type_name = 13;
  optional string true_failure_at = 14;
  optional DecisionEvidence decision = 15;
}
message SnapshotResponse {
  repeated WellRisk wells = 1;
  double alert_threshold = 2;
  double high_threshold = 3;
  optional string drift_verdict = 4;
  optional double drift_psi_max = 5;
  optional string drift_top = 6;
  optional Provenance provenance = 7;
  optional DecisionRule decision_rule = 8;
}
message ExplainRequest {
  int64 well_id = 1;
  optional int32 top_n = 2;
}
message Contribution {
  string feature = 1;
  double value = 2;
  double shap = 3;
  string label = 4;
  optional string value_source = 5;
}
message ExplainResponse {
  int64 well_id = 1;
  repeated Contribution contributions = 2;
}
message HistoryRequest {
  int64 well_id = 1;
  optional int32 limit = 2;
}
message RiskPoint {
  string window_end = 1;
  double risk = 2;
  bool fired = 3;
  optional double raw_score = 4;
  optional bool watch_fired = 5;
  optional bool high_fired = 6;
}
message HistoryResponse {
  int64 well_id = 1;
  double threshold = 2;
  double high_threshold = 3;
  int64 windows_total = 4;
  int64 windows_fired = 5;
  repeated RiskPoint points = 6;
  optional Provenance provenance = 7;
  optional DecisionRule decision_rule = 8;
  optional int64 accumulated_watch_count = 9;
  optional int64 accumulated_high_count = 10;
}
// Метаданные артефактов расширяются моделью независимо от транспорта.
message MetricsResponse {
  repeated google.protobuf.Struct models = 1;
}
// Имя передаётся в первом чанке; размер чанка <= 1 MiB, файл <= 50 MiB.
message UploadChunk {
  string filename = 1;
  bytes content = 2;
}
// Полная ожидаемая identity; version = upload_pin_v1, hashes = sha256:<64 lowercase hex>.
// Все поля обязательны для сервера; decision_rule сохраняет optional high и high_enabled=false.
// Имена/пути файлов, actor и business job metadata в pin не передаются.
message ExecutionPin {
  string version = 1;
  string model_name = 2;
  string bundle_sha256 = 3;
  string context_version = 4;
  DecisionRule decision_rule = 5;
  string feature_recipe_sha256 = 6;
  string feature_schema_sha256 = 7;
  string source_manifest_sha256 = 8;
  string runtime_manifest_sha256 = 9;
}
// Identity неизменяемых canonical bytes; source_kind = uploaded_file или cohort_snapshot.
message PinnedInputIdentity {
  string input_snapshot_id = 1;
  string canonical_sha256 = 2;
  string fingerprint_sha256 = 3;
  int64 canonical_bytes = 4;
  string source_kind = 5;
}
// Первый chunk содержит только этот полный header; pin и input обязательны.
message PinnedUploadHeader {
  ExecutionPin pin = 1;
  PinnedInputIdentity input = 2;
}
// Только первый chunk — header, далее только content <= 1 MiB; total <= 50 MiB.
// Сервер обязан проверить порядок/наличие header, полный pin и hash/размер canonical bytes
// до features/inference. SDK сам не валидирует поток и не гарантирует mandatory поля.
// Missing/repeated/out-of-order header, empty pin, input hash mismatch: INVALID_ARGUMENT.
// Unavailable/corrupt/mismatched pin или unsupported recipe: FAILED_PRECONDITION.
// Превышение лимита chunk/total: RESOURCE_EXHAUSTED. Причины ошибок — без private данных.
message PinnedUploadChunk {
  oneof payload {
    PinnedUploadHeader header = 1;
    bytes content = 2;
  }
}
message TimelinePoint {
  string window_end = 1;
  double risk = 2;
  optional double raw_score = 3;
  optional bool watch_fired = 4;
  optional bool high_fired = 5;
}
message UploadResponse {
  string verdict = 1;
  int64 n_windows = 2;
  int32 channels_used = 3;
  int32 features_total = 4;
  int64 windows_running = 5;
  int32 features_unavailable = 6;
  int64 windows_above_watch = 7;
  int64 windows_above_alert = 8;
  double latest_risk = 9;
  double peak_risk = 10;
  string peak_window_end = 11;
  repeated TimelinePoint timeline = 12;
  repeated Contribution contributions = 13;
  string filename = 14;
  int32 span_days = 15;
  optional string model_name = 16;
  optional string model_version = 17;
  optional string model_saved_at = 18;
  optional Provenance provenance = 19;
  optional DecisionRule decision_rule = 20;
}
message ModelHealthRequest {
  optional string drift_verdict = 1;
  optional double drift_psi_max = 2;
  int64 alerts_reviewed = 3;
  int64 alerts_false = 4;
}
message ModelHealthResponse {
  string urgency = 1;
  bool needed = 2;
  repeated string reasons = 3;
  optional string drift_verdict = 4;
  int64 alerts_reviewed = 5;
  int64 alerts_false = 6;
  optional double false_alert_rate = 7;
  optional double model_age_days = 8;
}

// Полное правило решения; display risk не заменяет raw-сравнение.
message ThresholdRule {
  string scale = 1;
  string comparison = 2;
  double threshold = 3;
  int64 k_windows = 4;
  optional double lookback_days = 5;
}
message DecisionRule {
  string context_version = 1;
  string policy_id = 2;
  string rule_sha256 = 3;
  ThresholdRule watch = 4;
  optional ThresholdRule high = 5;
  bool high_enabled = 6;
}
message DecisionEvidence {
  optional double raw_score = 1;
  optional int64 watch_count = 2;
  optional int64 high_count = 3;
}
// Публичный манифест содержит имена компонентов и digest без путей/секретов.
message ManifestEntry {
  string name = 1;
  optional string version = 2;
  optional string sha256 = 3;
}
message Provenance {
  string envelope_version = 1;
  string snapshot_id = 2;
  string computed_at = 3;
  optional string model_name = 4;
  optional string model_version = 5;
  optional string model_saved_at = 6;
  optional string context_version = 7;
  // Upload: hash переданного raw file; UploadPinned: hash canonical bytes.
  optional string input_sha256 = 8;
  optional string input_snapshot_id = 9;
  optional string as_of = 10;
  optional string feature_recipe_sha256 = 11;
  optional string feature_schema_sha256 = 12;
  optional string runtime_manifest_sha256 = 13;
  optional string source_manifest_sha256 = 14;
  repeated ManifestEntry runtime_manifest = 15;
  repeated ManifestEntry source_manifest = 16;
  string input_kind = 17;
  string context_completeness = 18;
  // complete | partial | historical_unknown; полнота происхождения, не качество.
  string provenance_status = 19;
}
