version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Сохраняем существующие имена и совместное использование wire messages.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
  rpc_allow_google_protobuf_empty_requests: true
breaking:
  use:
    - FILE
