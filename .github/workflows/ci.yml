name: CI
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true
    - name: Verify modules
      run: go mod verify
    - name: Test
      run: go test -race ./...
    - name: Vet
      run: go vet ./...
    - name: Build Linux binaries
      env:
        CGO_ENABLED: '0'
        GOOS: linux
        GOARCH: amd64
      run: 'mkdir -p dist

        go build -trimpath -o dist/pulse-api ./cmd/api

        go build -trimpath -o dist/pulse-migrate ./cmd/migrate

        cd dist

        sha256sum pulse-api pulse-migrate > SHA256SUMS

        '
    - uses: actions/upload-artifact@v4
      with:
        name: linux-amd64-${{ github.sha }}
        path: dist/*
        if-no-files-found: error
        retention-days: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pulse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pulse-ci-test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout
          5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:pulse-ci-test@127.0.0.1:5432/pulse_test?sslmode=disable
'on':
  push:
    branches:
    - main
    tags:
    - v*
  pull_request: null
  workflow_dispatch: null
