name: CI
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true
    - name: Checkout pinned contracts
      uses: actions/checkout@v6
      with:
        repository: effitech-pulse/pulse-contracts
        ref: 07213c430318affd140f55dea391cdc36220d93f
        path: .ci-contracts
        ssh-key: ${{ secrets.CONTRACTS_DEPLOY_KEY }}
        persist-credentials: false
    - name: Configure contracts workspace
      run: 'go work init . ./.ci-contracts

        go work edit -replace=github.com/effitech-pulse/pulse-contracts@v0.1.1=./.ci-contracts'
    - name: Check code formatting
      run: test -z "$(gofmt -l cmd internal api test)"
    - name: Unit, race, architecture and vet checks
      run: make check
    - name: PostgreSQL integration (required)
      run: make integration
    - name: Build Linux binaries
      env:
        CGO_ENABLED: '0'
        GOOS: linux
        GOARCH: amd64
      run: 'mkdir -p dist

        go build -trimpath -o dist/pulse-api ./cmd/api

        go build -trimpath -o dist/pulse-migrate ./cmd/migrate

        go build -trimpath -o dist/pulse-adminuser ./cmd/adminuser

        go build -trimpath -o dist/pulse-cohort ./cmd/cohort

        cd dist

        sha256sum pulse-api pulse-migrate pulse-adminuser pulse-cohort > SHA256SUMS

        '
    - uses: actions/upload-artifact@v4
      with:
        name: linux-amd64-${{ github.sha }}
        path: dist/*
        if-no-files-found: error
        retention-days: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pulse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pulse-ci-test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout
          5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:pulse-ci-test@127.0.0.1:5432/pulse_test?sslmode=disable
'on':
  push:
    branches:
    - main
    tags:
    - v*
  pull_request: null
  workflow_dispatch: null
