services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pulse_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pulse-test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulse_test"]
      interval: 2s
      timeout: 2s
      retries: 15
