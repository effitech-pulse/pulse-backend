apiVersion: 1
prune: true
datasources:
  - name: Pulse Loki
    uid: pulse-loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id"\s*:\s*"([a-f0-9]{32})"'
          datasourceUid: pulse-tempo
          url: '$${__value.raw}'
  - name: Pulse Tempo
    uid: pulse-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: pulse-loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        tags: [{key: service.name, value: service_name}]
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{$${__tags}} | json | trace_id = "$${__span.traceId}"'
  - name: Pulse Prometheus
    uid: pulse-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
