target: all
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
backend_scheduler:
  local_work_path: /var/tempo/scheduler
  provider:
    compaction:
      compaction:
        block_retention: 72h
backend_worker:
  compaction:
    block_retention: 72h
usage_report:
  reporting_enabled: false
