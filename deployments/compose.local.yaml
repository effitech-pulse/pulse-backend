name: pulse-local
services:
  frontend:
    image: pulse-frontend:local
    build: ../../pulse-frontend
    ports:
      - "127.0.0.1:${PULSE_HTTP_PORT:-8080}:80"
    depends_on:
      backend: {condition: service_started}
    networks: [app]
    restart: unless-stopped
  backend:
    image: pulse-backend:local
    build:
      context: ..
      dockerfile: build/package/Dockerfile
      additional_contexts:
        contracts: ../../pulse-contracts
    environment:
      HTTP_ADDR: :8000
      DATABASE_URL: ${PULSE_APP_DATABASE_URL:-postgresql://esp:esp@grant-postgres:5432/esp_app}
      ML_SERVICE_TARGET: ml:50051
      ML_AUTORUN_ENABLED: "false"
      TELEMETRY_DATA_API_URL: http://data:8092
      INTEGRATION_ALLOWED_HOSTS: data,127.0.0.1,localhost,grant-postgres,grant-clickhouse
      AUTH_MODE: local
      AUTH_COOKIE_SECURE: "false"
      APP_SCOPE: cohort
      COHORT_VERSION: ${PULSE_COHORT_VERSION:?Capture a cohort and set PULSE_COHORT_VERSION before startup}
      CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5174,http://localhost:5174
      GIN_MODE: release
      TZ: Europe/Moscow
    ports:
      - "127.0.0.1:8002:8000"
      - "127.0.0.1:8000:8000"
    volumes:
      - ../configs/parameters.local.json:/app/parameters_dict.json:ro
    depends_on:
      ml: {condition: service_healthy}
      data: {condition: service_healthy}
    networks: [app, postgres]
    restart: unless-stopped
  ml:
    image: pulse-ml-service:local
    build:
      context: ../../pulse-ml-service
      additional_contexts:
        model: ../../pulse-model
        contracts: ../../pulse-contracts
    environment:
      ML_GRPC_BIND: 0.0.0.0:50051
      ML_DATA_ROOT: /data
      PG_HOST: grant-postgres
      PG_PORT: "5432"
      PG_DB: esp
      PG_USER: esp
      PG_PASSWORD: ${PULSE_PG_PASSWORD:-esp}
    healthcheck:
      test: ["CMD", "python", "-m", "pulse_ml.healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
    volumes:
      - ../../workspace-data/models:/data/models:ro
      - ../../workspace-data/manifest:/data/manifest:ro
      - ../../workspace-data/cache/features_v3:/data/cache/features_v3:ro
    networks: [app, postgres]
    restart: unless-stopped
  data:
    image: pulse-data:local
    build:
      context: ../../pulse-data
      additional_contexts:
        model: ../../pulse-model
    environment:
      CLICKHOUSE_HOST: grant-clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: esp
      CLICKHOUSE_PASSWORD: ${PULSE_CLICKHOUSE_PASSWORD:-esp}
      CLICKHOUSE_DB: telemetry
    volumes:
      - ../../workspace-data/emulator:/data/emulator:ro
      - ../../workspace-data/reports/database_audit/telemetry_coverage.csv:/data/reports/telemetry_coverage.csv:ro
    networks: [app, clickhouse]
    restart: unless-stopped
networks:
  app: {}
  postgres: {external: true, name: postgres_default}
  clickhouse: {external: true, name: clickhouse_default}
