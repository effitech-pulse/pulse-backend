[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "effitech-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["effitech-esp-model==0.1.0", "fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2", "alembic>=1.13", "pydantic-settings>=2", "psycopg2-binary>=2.9", "PyJWT>=2.8", "python-multipart>=0.0.9"]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
